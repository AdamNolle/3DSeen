name: Release

# Tag-driven CD. Produces unsigned build artifacts for download.
# (Signed App Store / TestFlight distribution requires DEVELOPMENT_TEAM + signing
#  secrets; wire those in as repository secrets to extend this into a full pipeline.)

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  quality:
    name: Verify tagged commit
    uses: ./.github/workflows/ci.yml

  build-artifacts:
    name: Build unsigned artifacts
    needs: quality
    permissions:
      contents: write
    runs-on: macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Select pinned Xcode
        run: tools/ci/select-xcode.sh 26.3
      - name: Install pinned build tools
        run: tools/ci/install-tools.sh
      - name: Generate project
        run: xcodegen generate
      - name: Validate and export release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}" \
            tools/release/validate-version.sh --github-env
      - name: Ensure Metal Toolchain (no-op on stable Xcode)
        run: xcodebuild -downloadComponent MetalToolchain 2>/dev/null || true

      - name: Build iOS app (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme 3DSeen-iOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Build macOS app (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme 3DSeen-macOS \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/mac \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package artifacts
        run: |
          IOS_APP=$(find build/ios/Build/Products -name '3DSeen-iOS.app' -print -quit)
          MAC_APP=$(find build/mac/Build/Products -name '3DSeen-macOS.app' -print -quit)
          test -n "$IOS_APP" && test -d "$IOS_APP"
          test -n "$MAC_APP" && test -d "$MAC_APP"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "$IOS_APP" dist/3DSeen-iOS-${{ github.ref_name }}.app.zip
          ditto -c -k --sequesterRsrc --keepParent \
            "$MAC_APP" dist/3DSeen-macOS-${{ github.ref_name }}.app.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: 3DSeen-${{ github.ref_name }}
          path: dist/*.zip

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: dist/*.zip
          generate_release_notes: true

  signed-ios:
    name: Signed iOS archive and TestFlight upload
    if: vars.ENABLE_SIGNED_IOS_RELEASE == 'true'
    needs: quality
    runs-on: macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Select pinned Xcode
        run: tools/ci/select-xcode.sh 26.3
      - name: Install pinned build tools
        run: tools/ci/install-tools.sh
      - name: Generate project and version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodegen generate
          RELEASE_VERSION="${RELEASE_TAG#v}" \
            tools/release/validate-version.sh --github-env
      - name: Ensure Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain 2>/dev/null || true
      - name: Import Apple Distribution certificate
        env:
          SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: tools/release/import-certificate.sh
      - name: Archive, export, and upload to TestFlight
        id: archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          UPLOAD_TO_APP_STORE: 'true'
        run: tools/release/archive-ios.sh
      - name: Upload signed IPA evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: 3DSeen-iOS-signed-${{ github.ref_name }}
          path: ${{ steps.archive.outputs.ipa }}
      - name: Remove ephemeral signing material
        if: always()
        run: tools/release/cleanup-signing.sh

  signed-macos:
    name: Developer ID, notarization, and Gatekeeper
    if: vars.ENABLE_SIGNED_MACOS_RELEASE == 'true'
    needs: quality
    runs-on: macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Select pinned Xcode
        run: tools/ci/select-xcode.sh 26.3
      - name: Install pinned build tools
        run: tools/ci/install-tools.sh
      - name: Generate project and version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodegen generate
          RELEASE_VERSION="${RELEASE_TAG#v}" \
            tools/release/validate-version.sh --github-env
      - name: Import Developer ID certificate
        env:
          SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: tools/release/import-certificate.sh
      - name: Archive, notarize, staple, and assess
        id: archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_DEVELOPER_IDENTITY: ${{ secrets.MACOS_DEVELOPER_IDENTITY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: tools/release/archive-macos.sh
      - name: Upload notarized Mac artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: 3DSeen-macOS-notarized-${{ github.ref_name }}
          path: ${{ steps.archive.outputs.zip }}
      - name: Remove ephemeral signing material
        if: always()
        run: tools/release/cleanup-signing.sh
