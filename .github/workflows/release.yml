name: Release

# Tag-driven CD. Produces unsigned build artifacts for download.
# (Signed App Store / TestFlight distribution requires DEVELOPMENT_TEAM + signing
#  secrets; wire those in as repository secrets to extend this into a full pipeline.)

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  quality:
    name: Verify tagged commit
    uses: ./.github/workflows/ci.yml

  build-artifacts:
    name: Build unsigned artifacts
    needs: quality
    permissions:
      contents: write
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.3'
      - name: Install pinned build tools
        run: tools/ci/install-tools.sh
      - name: Generate project
        run: xcodegen generate
      - name: Ensure Metal Toolchain (no-op on stable Xcode)
        run: xcodebuild -downloadComponent MetalToolchain 2>/dev/null || true

      - name: Build iOS app (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme 3DSeen-iOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Build macOS app (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme 3DSeen-macOS \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/mac \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package artifacts
        run: |
          IOS_APP=$(find build/ios/Build/Products -name '3DSeen-iOS.app' -print -quit)
          MAC_APP=$(find build/mac/Build/Products -name '3DSeen-macOS.app' -print -quit)
          test -n "$IOS_APP" && test -d "$IOS_APP"
          test -n "$MAC_APP" && test -d "$MAC_APP"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "$IOS_APP" dist/3DSeen-iOS-${{ github.ref_name }}.app.zip
          ditto -c -k --sequesterRsrc --keepParent \
            "$MAC_APP" dist/3DSeen-macOS-${{ github.ref_name }}.app.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 3DSeen-${{ github.ref_name }}
          path: dist/*.zip

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*.zip
          generate_release_notes: true
