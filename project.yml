name: 3DSeen
options:
  bundleIdPrefix: com.adamnolle
  deploymentTarget:
    iOS: 17.0
    macOS: 14.0

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
  MetalSplatter:
    url: https://github.com/scier/MetalSplatter
    from: 0.1.1

targets:
  3DSeen-iOS:
    type: application
    platform: iOS
    sources:
      - Sources/iOS
      - Sources/Shared
    dependencies:
      - package: ZIPFoundation
      - package: MetalSplatter
        product: MetalSplatter
      - package: MetalSplatter
        product: SplatIO
      - package: MetalSplatter
        product: PLYIO
    info:
      path: Sources/iOS/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "3DSeen requires camera access for photogrammetry and spatial capture."
        NSLocalNetworkUsageDescription: "3DSeen requires local network access to offload rendering to your Mac."
        NSBonjourServices:
          - "_3dseen._tcp"
          - "_3dseen._udp"
    settings:
      base:
        DEVELOPMENT_TEAM: "" # Set in Xcode
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: 5.9
        PRODUCT_MODULE_NAME: ThreeDSeen
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - 3DSeen-iOSTests
      gatherCoverageData: true

  3DSeen-macOS:
    type: application
    platform: macOS
    sources:
      - Sources/macOS
      - Sources/Shared
    dependencies:
      - package: ZIPFoundation
    info:
      path: Sources/macOS/Info.plist
      properties:
        NSLocalNetworkUsageDescription: "3DSeen requires local network access to receive renders from your iPhone."
        NSBonjourServices:
          - "_3dseen._tcp"
          - "_3dseen._udp"
    settings:
      base:
        DEVELOPMENT_TEAM: "" # Set in Xcode
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: 5.9
        PRODUCT_MODULE_NAME: ThreeDSeenMac
        CODE_SIGN_ENTITLEMENTS: Sources/macOS/3DSeen-macOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - 3DSeen-macOSTests
      gatherCoverageData: true

  3DSeen-iOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/iOS
    dependencies:
      - target: 3DSeen-iOS
      - package: MetalSplatter
        product: SplatIO
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.9

  3DSeen-macOSTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/macOS
    dependencies:
      - target: 3DSeen-macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.9
